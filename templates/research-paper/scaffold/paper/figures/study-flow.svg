  <rect x="45" y="90" width="210" height="120" rx="18" fill="#ffffff" stroke="#17324d" stroke-width="4"/>
  <rect x="345" y="90" width="210" height="120" rx="18" fill="#17324d"/>
  <rect x="645" y="90" width="210" height="120" rx="18" fill="#ffffff" stroke="#176b73" stroke-width="4"/>
  <path d="M270 150 H325 M570 150 H625" stroke="#176b73" stroke-width="8"/>
