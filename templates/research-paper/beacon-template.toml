schema_version = 1
id = "research-paper"
name = "Research Paper"
version = "0.1.0"
description = "A project-owned LaTeX research-paper profile with deterministic PDF, accessible web, and arXiv-source outputs."
category = "research"
license = "MIT"
source = "original Beacon implementation informed by dispositioned staged academic-article references"

[[outputs]]
format = "pdf"
renderer = "latexmk"
entrypoint = "paper/paper.tex"

[[outputs]]
format = "html"
renderer = "pandoc"
template = "web/paper.html"

[[outputs]]
format = "arxiv-source"
renderer = "scripts/build.py"
entrypoint = "main.tex"

[metadata]
required = ["id", "title", "authors", "abstract", "keywords", "date", "version", "language", "source_repository"]
optional = ["subtitle", "orcid", "email", "affiliation", "credit_roles", "arxiv_category", "doi"]

[initializer]
runtime = "python3"
script = "scripts/bootstrap.py"
required = ["destination", "title", "author"]
optional = ["project-id", "theme"]

[execution]
program = "python3"
arguments = ["{{project}}/scripts/tasks.py", "check-content", "--project={{project}}", "--build-dir={{output}}", "--theme={{theme}}"]
default_output = "build"
default_theme = "neutral"
artifacts = ["paper.pdf", "web/index.html", "provenance.json", "arxiv"]

[execution.theme_values]
neutral = "neutral"
egohygiene = "egohygiene"

[[execution.requirements]]
command = "python3"

[[execution.requirements]]
command = "latexmk"

[[execution.requirements]]
command = "pdflatex"

[[execution.requirements]]
command = "bibtex"

[[execution.requirements]]
command = "pandoc"

[[execution.requirements]]
command = "pdfinfo"
version_arguments = ["-v"]

[[execution.requirements]]
command = "pdffonts"
version_arguments = ["-v"]

[[execution.requirements]]
command = "rsvg-convert"
alternatives = ["inkscape"]

[capabilities]
abstract = true
acknowledgements = true
appendices = true
arxiv_source = true
bibliography = true
citations = true
credit_roles = true
data_availability = true
equations = true
ethics_statement = true
figures = true
html = true
identity_themes = true
limitations = true
make_entrypoint = true
orcid = true
pdf = true
project_owned_execution = true
provenance = true
reproducibility_checks = true
standalone_build_kit = true
tables = true
taskfile_entrypoint = true
web_accessibility_checks = true
