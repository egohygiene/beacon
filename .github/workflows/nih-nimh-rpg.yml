name: NIH/NIMH template

on:
  pull_request:
    paths:
      - "templates/nih-nimh-rpg/**"
      - ".github/workflows/nih-nimh-rpg.yml"
  push:
    branches: [main]
    paths:
      - "templates/nih-nimh-rpg/**"
      - ".github/workflows/nih-nimh-rpg.yml"

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Task runner
        uses: go-task/setup-task@70f2430ad412f838533de8c0515c749ffb2b8bd3 # v1
        with:
          version: "3.53.1"
      - name: Install deterministic build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            latexmk \
            poppler-utils \
            texlive-fonts-recommended \
            texlive-latex-base \
            texlive-latex-recommended
      - name: Prove standalone Make and Task parity
        shell: bash
        run: |
          set -euo pipefail
          workspace="$(mktemp -d)"
          cargo run --quiet --locked -- doctor nih-nimh-rpg
          cargo run --quiet --locked -- init nih-nimh-rpg "$workspace/project" \
            --title "Beacon NIH Adapter" \
            --author "Beacon Maintainers"

          profile="$GITHUB_WORKSPACE/templates/nih-nimh-rpg"
          hidden_profile="$workspace/nih-nimh-rpg-profile"
          restore_profile() {
            if [[ -d "$hidden_profile" && ! -e "$profile" ]]; then
              mv "$hidden_profile" "$profile"
            fi
          }
          trap restore_profile EXIT
          mv "$profile" "$hidden_profile"
          make --directory="$workspace/project" check
          make --directory="$workspace/project" clean
          task --dir "$workspace/project" check
          task --dir "$workspace/project" clean
          restore_profile
          trap - EXIT

          cargo run --quiet --locked -- package "$workspace/project"
          test -f "$workspace/project/dist/nih-nimh-rpg-0.1.0/beacon-package.json"
