name: Research paper

on:
  pull_request:
    paths:
      - "templates/research-paper/**"
      - ".github/workflows/research-paper.yml"
  push:
    branches: [main]
    paths:
      - "templates/research-paper/**"
      - ".github/workflows/research-paper.yml"

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        theme: [neutral, egohygiene]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install deterministic build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            latexmk \
            librsvg2-bin \
            lmodern \
            pandoc \
            poppler-utils \
            texlive-fonts-recommended \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-latex-recommended \
            texlive-pictures
      - name: Build and validate the profile
        run: make --directory="templates/research-paper" reproducibility bootstrap-check THEME="${{ matrix.theme }}"
      - name: Prove the shared Beacon execution adapter
        shell: bash
        run: |
          set -euo pipefail
          workspace="$(mktemp -d)"
          trap 'rm -rf "$workspace"' EXIT
          cargo run --quiet --locked -- doctor research-paper
          cargo run --quiet --locked -- init research-paper "$workspace/project" \
            --title "Beacon Research Adapter" \
            --author "Beacon Maintainers" \
            --theme "${{ matrix.theme }}"
          cargo run --quiet --locked -- package "$workspace/project"
          test -f "$workspace/project/dist/research-paper-0.1.0/beacon-package.json"
