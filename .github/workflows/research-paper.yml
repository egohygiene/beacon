name: Research paper

on:
  pull_request:
    paths:
      - "templates/research-paper/**"
      - ".github/workflows/research-paper.yml"
  push:
    branches: [main]
    paths:
      - "templates/research-paper/**"
      - ".github/workflows/research-paper.yml"

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        theme: [neutral, egohygiene]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Task runner
        uses: go-task/setup-task@70f2430ad412f838533de8c0515c749ffb2b8bd3 # v1
        with:
          version: "3.53.1"
      - name: Install deterministic build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            latexmk \
            librsvg2-bin \
            lmodern \
            pandoc \
            poppler-utils \
            texlive-fonts-recommended \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-latex-recommended \
            texlive-pictures
      - name: Build and validate the profile
        run: make --directory="templates/research-paper" reproducibility bootstrap-check PROJECT="examples/reference-paper" THEME="${{ matrix.theme }}"
      - name: Prove standalone Make and Task parity
        shell: bash
        run: |
          set -euo pipefail
          workspace="$(mktemp -d)"
          cargo run --quiet --locked -- doctor research-paper
          cargo run --quiet --locked -- init research-paper "$workspace/project" \
            --title "Beacon Research Adapter" \
            --author "Beacon Maintainers" \
            --theme "${{ matrix.theme }}"

          profile="$GITHUB_WORKSPACE/templates/research-paper"
          hidden_profile="$workspace/research-paper-profile"
          restore_profile() {
            if [[ -d "$hidden_profile" && ! -e "$profile" ]]; then
              mv "$hidden_profile" "$profile"
            fi
          }
          trap restore_profile EXIT
          mv "$profile" "$hidden_profile"
          make --directory="$workspace/project" check-content
          make --directory="$workspace/project" clean
          task --dir "$workspace/project" check-content
          task --dir "$workspace/project" clean
          restore_profile
          trap - EXIT

          cargo run --quiet --locked -- package "$workspace/project"
          test -f "$workspace/project/dist/research-paper-0.1.0/beacon-package.json"
