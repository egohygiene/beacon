---
name: Beacon core

on:
  pull_request:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "Taskfile.yml"
      - "contracts/**"
      - "rust-toolchain.toml"
      - "src/**"
      - "templates/*/beacon-template.toml"
      - "templates/*/Makefile"
      - "templates/*/Taskfile.yml"
      - "templates/*/scripts/*.py"
      - "templates/*/scaffold/beacon-project.toml"
      - "tests/**"
      - ".github/workflows/core.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "Taskfile.yml"
      - "contracts/**"
      - "rust-toolchain.toml"
      - "src/**"
      - "templates/*/beacon-template.toml"
      - "templates/*/Makefile"
      - "templates/*/Taskfile.yml"
      - "templates/*/scripts/*.py"
      - "templates/*/scaffold/beacon-project.toml"
      - "tests/**"
      - ".github/workflows/core.yml"

permissions:
  contents: read

concurrency:
  group: "beacon-core-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "1.97.1" \
            --profile "minimal" \
            --component "clippy,rustfmt"

      - name: Install the pinned Task runner
        uses: go-task/setup-task@70f2430ad412f838533de8c0515c749ffb2b8bd3 # v1
        with:
          version: "3.53.1"

      - name: Run the local core contract
        run: task check
