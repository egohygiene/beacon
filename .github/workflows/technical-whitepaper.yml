name: Technical whitepaper

on:
  pull_request:
    paths:
      - "templates/technical-whitepaper/**"
      - ".github/workflows/technical-whitepaper.yml"
  push:
    branches: [main]
    paths:
      - "templates/technical-whitepaper/**"
      - ".github/workflows/technical-whitepaper.yml"

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - theme: organization
            theme_path: themes/organization.json
          - theme: product
            theme_path: themes/product.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Task runner
        uses: go-task/setup-task@70f2430ad412f838533de8c0515c749ffb2b8bd3 # v1
        with:
          version: "3.53.1"
      - name: Install deterministic build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            lmodern \
            pandoc \
            poppler-utils \
            texlive-fonts-recommended \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-latex-recommended \
            texlive-pictures
      - name: Build and validate the profile
        run: make --directory="templates/technical-whitepaper" reproducibility THEME="${{ matrix.theme_path }}"
      - name: Prove standalone Make and Task parity
        shell: bash
        run: |
          set -euo pipefail
          workspace="$(mktemp -d)"
          cargo run --quiet --locked -- doctor technical-whitepaper
          cargo run --quiet --locked -- init technical-whitepaper "$workspace/project" \
            --title "Beacon Whitepaper Adapter" \
            --author "Beacon Maintainers" \
            --theme "${{ matrix.theme }}"

          profile="$GITHUB_WORKSPACE/templates/technical-whitepaper"
          hidden_profile="$workspace/technical-whitepaper-profile"
          restore_profile() {
            if [[ -d "$hidden_profile" && ! -e "$profile" ]]; then
              mv "$hidden_profile" "$profile"
            fi
          }
          trap restore_profile EXIT
          mv "$profile" "$hidden_profile"
          make --directory="$workspace/project" check-content
          make --directory="$workspace/project" clean
          task --dir "$workspace/project" check-content
          task --dir "$workspace/project" clean
          restore_profile
          trap - EXIT

          cargo run --quiet --locked -- package "$workspace/project"
          package="$workspace/project/dist/technical-whitepaper-0.1.0"
          test -f "$package/artifacts/whitepaper.pdf"
          test -f "$package/artifacts/web/index.html"
          test -f "$package/beacon-package.json"
          test -f "$package/SHA256SUMS"
          (cd "$package" && sha256sum --check "SHA256SUMS")
