[package]
name = "beacon"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Local-first project bootstrapper and template library."
license = "MIT"
repository = "https://github.com/egohygiene/empathy"
publish = false

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.51", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
toml = "0.9.8"

[dev-dependencies]
tempfile = "3.23.0"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
