---
# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

tasks:
  default:
    desc: List Beacon tasks
    cmds:
      - task --list
    silent: true

  check:
    desc: Validate Beacon templates and Rust CLI
    cmds:
      - python3 scripts/validate_templates.py --repository-root ".."
      - cargo fmt --all --check
      - cargo clippy --all-targets --all-features -- -D warnings
      - cargo test --all-features

  smoke:
    desc: Exercise Beacon project generation through the compiled CLI
    cmds:
      - cargo test --all-features --test cli_smoke

  list:
    desc: List installed Beacon templates
    cmds:
      - cargo run --quiet -- --templates-directory "templates" list

  validate:
    desc: Validate installed Beacon templates through the Rust CLI
    cmds:
      - cargo run --quiet -- --templates-directory "templates" validate
