[package]
name = "beacon"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.97"
description = "Local-first publication profile registry and project initializer"
license = "MIT"
repository = "https://github.com/egohygiene/beacon"
readme = "README.md"
keywords = ["publishing", "latex", "research", "templates", "cli"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.51", features = ["derive", "env"] }
serde = { version = "1.0.228", features = ["derive"] }
tempfile = "3.23.0"
toml = "0.9.8"

[dev-dependencies]
tempfile = "3.23.0"

[workspace]
resolver = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
